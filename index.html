        pb.querySelector('.prog-size').innerHTML = '⌀&#8239;' + f1(p.d) + '&#8239;×&#8239;' + f1(p.t) + NB + 'мм';
        pb.setAttribute('aria-label', 'Программа ' + p.code + ' ' + p.model);
        $('gas-status').classList.toggle('is-bad', !gasOk());
        $('gas-status').classList.toggle('is-busy', S.test.gas > 0);
        $('water-status').classList.toggle('is-bad', !waterOk());
        $('water-status').classList.toggle('is-busy', S.test.water > 0);
        screen.classList.toggle('is-locked', S.screen === 'weld' && RUNNING.indexOf(S.phase) >= 0);
        // Готовность: нет газа / воды / горелка не в нуле
        var alert = '';
        if (S.phase === 'ready') alert = !gasOk() ? 'gas' : !waterOk() ? 'water' : !torchZero() ? 'torch' : '';
        if (alert) screen.setAttribute('data-alert', alert); else screen.removeAttribute('data-alert');
        if (S.phase === 'ready') {
          statusText.textContent = alert === 'gas' ? 'Нет давления газа' : alert === 'water' ? 'Нет протока воды'
            : alert === 'torch' ? 'Горелка не' + NBSP + 'в' + NBSP + 'нуле' : STATUS.ready;
          startBtn.classList.toggle('is-disabled', !!alert);
          startBtn.querySelector('small').innerHTML = alert === 'gas' ? 'Нет давления газа' : alert === 'water' ? 'Нет протока охлаждения'
            : alert === 'torch' ? 'Сначала верните горелку в' + NB + 'ноль' : 'Удерживайте 1' + NB + 'сек';
        }
        // переключатели панели презентера
        document.querySelectorAll('#seg-head button').forEach(function (b) { b.classList.toggle('is-on', b.dataset.head === headOf(prog().model)); });
        document.querySelectorAll('#seg-speed button').forEach(function (b) { b.classList.toggle('is-on', +b.dataset.speed === S.speed); });
        document.querySelectorAll('#seg-scn button').forEach(function (b) { b.classList.toggle('is-on', b.dataset.scn === S.scn); });
      }

      // ================= Плашка главного экрана =================
      var panelMode = '';
      function chipsHTML() {
        var c = prog().common, act = funcsAvail().filter(function (f) { return c[f.k]; });
        var shown = act.slice(0, 2), rest = act.length - shown.length;
        var more = rest > 0 ? '<button class="more" type="button" data-sheet="funcs" aria-label="Ещё ' + rest + '">+' + rest + '</button>'
          : act.length ? '<button class="more" type="button" data-sheet="funcs" aria-label="Функции">' + svg('plus') + '</button>'
          : '<button class="more more--wide" type="button" data-sheet="funcs">' + svg('plus') + 'Функции</button>';
        return '<div class="pills">' + shown.map(function (f) {
          return '<div class="pill">' + f.chip + '<button class="x" type="button" data-func="' + f.k + '" aria-label="Выключить «' + f.chip + '»">' + svg('x') + '</button></div>';
        }).join('') + more + '</div>';
      }
      function readyHTML() {
        var p = prog(), c = p.common, s = p.sec, n = c.sectors;
        if (isOpen()) {
          return '<h3>Режим сварки<span class="sp"></span><span class="tag">' + c.curMode + '</span><span class="tag tag--open">Открытая головка</span></h3>' +
            '<div class="mode-grid">' +
            '<div><label>Скорость сварки</label><div class="v">' + f2(avg(s.speed)) + NB + '<small>об/мин</small></div></div>' +
            '<div><label>Время прохода, расч.</label><div class="v">' + mmss(revTime(p)) + NB + '<small>мин</small></div></div>' +
            '<div><label>Напряжение (слежение)</label><div class="v">' + f1(avg(s.avcV)) + NB + '<small>В</small></div></div>' +
            '<div><label>Ток импульса</label><div class="v">' + Math.max.apply(null, s.pulseHi) + NB + '<small>А</small></div></div>' +
            '</div>' + chipsHTML();
        }
        return '<h3>Режим сварки<span class="sp"></span><span class="tag">' + c.curMode + '</span><span class="tag tag--closed">Закрытая головка</span></h3>' +
          '<div class="mode-grid">' +
          '<div><label>Ток по секторам</label><div class="v">' + s.pulseHi[0] + '–' + s.pulseHi[n - 1] + NB + '<small>А</small></div></div>' +
          '<div><label>Время шва, расч.</label><div class="v">' + mmss(revTime(p)) + NB + '<small>мин</small></div></div>' +
          '<div><label>Газ до</label><div class="v">' + fx(c.gasBefore, 0) + NB + '<small>сек</small></div></div>' +
          '<div><label>Газ после</label><div class="v">' + fx(c.gasAfter, 0) + NB + '<small>сек</small></div></div>' +
          '</div>' + chipsHTML();
      }
      function stepperHTML(key, label, top) {
        var c = CORR[key];
        return '<div class="stepper" style="top:' + top + 'px">' +
          '<button class="pm" type="button" data-step="-1" data-key="' + key + '" aria-label="Меньше">' + svg(c.lr ? 'chevL' : 'minus') + '</button>' +
          '<div class="sv" id="p-sv-' + key + '"><label>' + label + '</label><div class="num"><b id="p-corr-' + key + '">0</b><small>' + c.u + '</small></div></div>' +
          '<button class="pm" type="button" data-step="1" data-key="' + key + '" aria-label="Больше">' + svg(c.lr ? 'chevR' : 'plus') + '</button>' +
          '</div>';
      }
      function processHTML() {
        var head = '<h3>Текущая сварка<span class="sp"></span><span class="panel-timer" id="p-tmr">00:00</span></h3>';
        if (isOpen()) {
          return head +
            '<div class="live-grid">' +
            '<div><label>Ск-ть сварки</label><div class="lv stack"><span id="p-rpm">0.00</span><small>об/мин</small></div></div>' +
            '<div><label>Проволока</label><div class="lv stack"><span id="p-wire">0</span><small>мм/мин</small></div></div>' +
            '<div><label>Напряжение</label><div class="lv"><i class="arc-dot off" id="p-dv"></i><span id="p-volt">0.0</span><small>В</small></div></div>' +
            '<div><label>Ток</label><div class="lv"><i class="arc-dot off" id="p-da"></i><span id="p-cur">0</span><small>А</small></div></div>' +
            '</div>' +
            '<div class="corr-tabs">' + ['wire', 'cur', 'arc', 'spd', 'osc'].map(function (t) {
              return '<button type="button" data-tab="' + t + '" class="' + (S.tab === t ? 'is-on' : '') + '">' + CORR[t].l + '</button>';
            }).join('') + '</div>' +
            stepperHTML(S.tab, CORR[S.tab].l, 218);
        }
        return head +
          '<div class="live-closed">' +
          '<div class="lv-row" style="top:87px"><label>Скорость сварки</label><div class="lv"><i class="arc-dot off" id="p-dr"></i><span id="p-rpm">0</span><small>об/мин</small></div></div>' +
          '<div class="lv-row" style="top:170px"><label>Напряжение</label><div class="lv"><i class="arc-dot off" id="p-dv"></i><span id="p-volt">0.0</span><small>В</small></div></div>' +
          '<div class="lv-row" style="top:253px"><label>Ток</label><div class="lv"><i class="arc-dot off" id="p-da"></i><span id="p-cur">0</span><small>А</small></div></div>' +
          '</div>' +
          stepperHTML('spd', 'Ск-ть', 127) + stepperHTML('cur', 'Ток', 243);
      }
      function summaryHTML() {
        var m = S.sum || { time: 0, cur: 0, volt: 0, angle: 0 }, ok = S.completed, p = prog();
        var title = ok ? 'Итоги сварки' : (S.err ? 'Сварка прервана' : 'Сварка остановлена');
        var tag = ok ? '<span class="tag tag--ok">Шов завершён</span>' : '<span class="tag tag--err">на' + NB + Math.round(m.angle) + '°</span>';
        return '<h3>' + title + '<span class="sp"></span>' + tag + '</h3>' +
          '<div class="mode-grid">' +
          '<div><label>Время сварки</label><div class="v">' + mmss(m.time) + NB + '<small>мин</small></div></div>' +
          '<div><label>Программа</label><div class="v">' + p.code + NB + '<small>' + p.model + '</small></div></div>' +
          '<div><label>Ток, средний</label><div class="v">' + (m.cur ? Math.round(m.cur) : '—') + NB + '<small>А</small></div></div>' +
          '<div><label>Напряжение, ср.</label><div class="v">' + (m.volt ? f1(m.volt) : '—') + NB + '<small>В</small></div></div>' +
          '</div>' +
          (S.err ? '<div class="panel-error">' + svg('alert') + S.err.replace('Аварийная остановка: ', 'Причина: ') + '</div>' : '');
      }
      function renderPanel() {
        var ph = S.phase;
        var mode = ph === 'ready' ? 'ready' : (ph === 'done' || ph === 'aborted' || ph === 'returning') ? 'summary' : 'process';
        panel.classList.toggle('is-summary', mode === 'summary');
        panel.setAttribute('aria-label', mode === 'ready' ? 'Режим сварки' : mode === 'process' ? 'Текущая сварка' : 'Итоги сварки');
        panel.innerHTML = mode === 'ready' ? readyHTML() : mode === 'process' ? processHTML() : summaryHTML();
        panelMode = mode;
        lastLive = 0;
      }

      // Живые показания — зависят от секции, коррекций и этапа
      function live() {
        var p = prog(), c = p.common, ph = S.phase, j = function (a) { return (Math.random() - 0.5) * a; };
        var moving = ph === 'welding' || ph === 'decay';
        var arc = ph === 'warm' || moving;
        var k = ph === 'decay' ? Math.max(0, 1 - S.phaseT / Math.max(0.1, c.decay)) : 1;
        var i = sectorOf(weldAngle()) - 1, cur = 0;
        if (ph === 'warm') cur = c.warmCur + j(2);
        else if (arc) cur = (c.curMode === 'Импульс' ? p.sec.pulseHi[i] : p.sec.base[i]) * (1 + S.corr.cur / 100) * k + j(2.5);
        return {
          arc: arc,
          cur: Math.max(0, cur),
          volt: arc ? (p.sec.avcV[i] + S.corr.arc + j(0.1)) * Math.max(k, 0.6) : 0,
          rpm: moving ? p.sec.speed[i] * (1 + S.corr.spd / 100) * (isOpenP(p) ? 0.92 : 1) : 0,
          wire: moving ? p.sec.wire[i] * (1 + S.corr.wire / 100) * k : 0
        };
      }
      var lastLive = 0;
      function syncPanel(now) {
        if (panelMode !== 'process') return;
        setText('p-tmr', mmss0(S.weldT));
        Object.keys(CORR).forEach(function (key) {
          var b = $('p-corr-' + key); if (!b) return;
          var c = CORR[key], v = S.corr[key];
          setText('p-corr-' + key, v === 0 ? fx(0, c.d) : signed(v, c.d));
          $('p-sv-' + key).classList.toggle('is-changed', v !== 0);
        });
        if (now - lastLive < 280) return;                  // показания обновляются ~3 раза в секунду
        lastLive = now;
        var L = live(), ph = S.phase;
        setText('p-rpm', isOpen() ? f2(L.rpm) : String(Math.round(L.rpm)));
        setText('p-wire', String(Math.round(L.wire)));
        setText('p-volt', f1(L.volt));
        setText('p-cur', String(Math.round(L.cur)));
        var dotCls = 'arc-dot ' + (L.arc ? (ph === 'decay' || ph === 'warm' ? 'warn' : '') : 'off');
        ['p-dv', 'p-da'].forEach(function (id) { var e = $(id); if (e) e.className = dotCls; });
        var dr = $('p-dr'); if (dr) dr.className = 'arc-dot ' + (ph === 'welding' || ph === 'decay' ? '' : 'off');
      }

      // Клики в плашке: функции, вкладки, коррекции (с удержанием)
      panel.addEventListener('click', function (e) {
        var x = e.target.closest('[data-func]');
        if (x) { prog().common[x.dataset.func] = false; renderPanel(); return; }
        if (e.target.closest('[data-sheet]')) { openSheet('funcs'); return; }
        var t = e.target.closest('[data-tab]');
        if (t) { S.tab = t.dataset.tab; renderPanel(); }
      });
      function corrStep(key, d) {
        var c = CORR[key];
        S.corr[key] = Math.max(-c.lim, Math.min(c.lim, Math.round((S.corr[key] + d * c.step()) * 100) / 100));
      }

      // ================= Удержание с автоповтором (коррекции и ручной режим) =================
      var holdT = null, holdI = null, holdEl = null;
      function holdStep(el) {
        var kind = el.dataset.hold, d = +el.dataset.d || 0, k = el.dataset.key;
        if (kind === 'corr') corrStep(k, d);
        if (kind === 'jog') { var step = k === 'cur' || k === 'spd' ? 1 : 0.5; S.jog[k] = Math.max(-50, Math.min(50, Math.round((S.jog[k] + d * step) * 10) / 10)); }
        if (kind === 'rot') S.torch = Math.round((S.torch + d * (holdI ? 3 : 1)) * 10) / 10;
        if (kind === 'retract') S.jog.wire = Math.max(-50, Math.round((S.jog.wire - 0.5) * 10) / 10);
      }
      function holdEnd() {
        clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null;
        if (holdEl) {
          holdEl.classList.remove('is-held');
          if (holdEl.dataset.hold === 'retract') { var t = $('rt-txt'); if (t) t.innerHTML = 'Оттяжка<br>проволоки'; }
        }
        holdEl = null;
      }
      screen.addEventListener('pointerdown', function (e) {
        var el = e.target.closest('[data-hold]');
        if (!el) {
          var st = e.target.closest('[data-step]');
          if (!st) return;
          st.dataset.hold = 'corr'; st.dataset.d = st.dataset.step;
          el = st;
        }
        holdEl = el; el.classList.add('is-held'); holdStep(el);
        if (el.dataset.hold === 'retract') { var t = $('rt-txt'); if (t) t.textContent = 'Оттяжка…'; }
        holdT = setTimeout(function () { holdI = setInterval(function () { holdStep(el); }, 70); }, 380);
      });
      ['pointerup', 'pointercancel'].forEach(function (t) { document.addEventListener(t, holdEnd); });
      screen.addEventListener('pointerleave', holdEnd);

      // ================= Этапы процесса =================
      function go(phase) {
        var prev = S.phase;
        S.phase = phase;
        S.phaseT = 0;
        S.phaseR = 0;
        screen.setAttribute('data-weld', phase);
        screen.toggleAttribute('data-soft', S.soft);   // остановлено плавно — без красного
        statusText.textContent = phase === 'aborted' && S.err ? 'Аварийная остановка' : STATUS[phase];
        smooth.classList.toggle('is-dim', phase === 'decay');
        // Синяя кнопка: «Вернуть горелку в ноль» (нажимается) или «Возврат в 0…» (тусклая)
        returnBtn.textContent = phase === 'returning' ? 'Возврат в' + NBSP + '0…' : 'Вернуть горелку в' + NBSP + 'ноль';
        returnBtn.classList.toggle('is-dim', phase === 'returning');
        gauge.setDone(phase === 'done');               // шов готов — шкала зеленеет
        gauge.setPurge(phase === 'prepurge' || phase === 'postpurge');   // продувка — синяя шкала
        // Красная шкала со вспышками: «Стоп» и итог жёсткой остановки; плавная остановка — без красного
        gauge.setAlarm(phase === 'halt' || (phase === 'aborted' && !S.soft));
        // Итоги считаются при окончании продувки (готово или остановлено)
        if ((phase === 'done' || phase === 'aborted') && prev === 'postpurge') finishSummary();
        renderPanel();
        syncHeader();
      }
      function finishSummary() {
        var a = S.acc;
        S.sum = { time: S.weldT, cur: a.n ? a.cur / a.n : 0, volt: a.n ? a.volt / a.n : 0, angle: S.completed ? 360 : S.stopAngle };
      }
      function startWeld() {
        if (S.phase !== 'ready' || !gasOk() || !waterOk() || !torchZero()) return;
        S.weldT = 0; S.completed = false; S.torch = 0; S.soft = false; S.err = null;
        S.corr = { wire: 0, cur: 0, arc: 0, spd: 0, osc: 0 };
        S.acc = { n: 0, cur: 0, volt: 0 };
        go('prepurge');
      }
      function stopNow() {
        if (S.phase === 'prepurge' || S.phase === 'warm') { go('ready'); note('Запуск отменён до начала сварки'); return; }
        // «СТОП»: сначала статус «Стоп» (красный), затем продувка
        if (S.phase === 'welding' || S.phase === 'decay') {
          S.stopAngle = weldAngle(); S.soft = false; go('halt');
          note('СТОП: дуга погашена сразу, затем продувка газом');
          return;
        }
        if (S.phase === 'postpurge') note('Идёт продувка после сварки — защищает шов от' + NBSP + 'окисления');
      }
      function smoothStop() {
        if (S.phase === 'prepurge' || S.phase === 'warm') { go('ready'); note('Запуск отменён до начала сварки'); return; }
        if (S.phase === 'welding') {
          S.soft = true; go('decay');                  // плавно — без красного
          note('Плавное гашение: ток снижается за' + NBSP + 'время затухания (' + f1(prog().common.decay) + NBSP + 'с)');
          return;
        }
        if (S.phase === 'postpurge') note('Идёт продувка после сварки — защищает шов от' + NBSP + 'окисления');
      }
      function errorStop(msg) {
        S.err = msg; S.stopAngle = weldAngle(); S.completed = false; S.soft = false;
        finishSummary();
        go('aborted');
        note(msg);
      }
      function returnZero() {
        if (S.phase === 'aborted' || S.phase === 'done') {
          S.torch = S.phase === 'done' ? 0 : S.stopAngle;
          go(S.torch === 0 ? 'ready' : 'returning');
          return;
        }
        if (S.phase === 'ready') {
          if (torchZero()) return;
          S.torch = norm(S.torch);
          go('returning');
        }
      }

      var last = performance.now();
      function tick(now) {
        var dtR = Math.min(0.1, (now - last) / 1000); last = now;
        var dt = dtR * S.speed, c = prog().common, p = prog();
        S.phaseT += dt;
        S.phaseR += dtR * 1000;
        ['gas', 'water'].forEach(function (k) {
          if (S.test[k] > 0) { S.test[k] -= dtR; if (S.test[k] <= 0) { S.test[k] = 0; if (S.screen === 'manual') renderScreen(); syncHeader(); } }
        });
        if (['prepurge', 'warm', 'welding', 'decay'].indexOf(S.phase) >= 0 && (!gasOk() || !waterOk()))
          errorStop(!gasOk() ? 'Аварийная остановка: нет давления газа' : 'Аварийная остановка: нет протока охлаждения');
        switch (S.phase) {
          case 'prepurge': if (S.phaseT >= c.gasBefore) go(c.warmTime > 0 ? 'warm' : 'welding'); break;
          case 'warm':     if (S.phaseT >= c.warmTime) go('welding'); break;
          case 'welding':
            S.weldT += dt;
            (function () { var L = live(); if (L.arc) { S.acc.n++; S.acc.cur += L.cur; S.acc.volt += L.volt; } })();
            if (S.weldT >= revTime(p)) { S.weldT = revTime(p); S.completed = true; go('decay'); }
            break;
          case 'decay':
            if (!S.completed) S.weldT += dt * 0.5;        // при плавной остановке горелка ещё немного едет
            if (S.phaseT >= c.decay) { S.stopAngle = weldAngle(); go('postpurge'); }
            break;
          case 'halt':     if (S.phaseR >= HALT_MS) go('postpurge'); break;
          case 'postpurge':
            if (S.phaseT >= c.gasAfter) {
              go(S.completed ? 'done' : 'aborted');
              // Возврат в 0 после сварки включён в программе — запускается сам
              if (!S.completed && c.ret0) setTimeout(function () {
                if (S.phase === 'aborted') { returnZero(); note('Возврат в' + NBSP + 'точку 0 после сварки включён в' + NBSP + 'программе'); }
              }, 900);
            }
            break;
          case 'returning':
            S.torch = Math.max(0, S.torch - c.retSpeed * 0.6 * dtR);
            if (S.torch <= 0) { S.torch = 0; go('ready'); }
            break;
        }
        sync();
        syncPanel(now);
        requestAnimationFrame(tick);
      }

      // Круговая диаграмма и показания в центре; ручной режим — значения
      var lastDeg = '', lastSub = '';
      function sync() {
        var ph = S.phase, ang = 0, sub = '', deg;
        if (ph === 'ready') { sub = torchZero() ? 'Горелка на' + NBSP + 'нуле' : 'Горелка не' + NBSP + 'на' + NBSP + 'нуле'; }
        else if (ph === 'prepurge') sub = 'Газ до: ' + Math.max(0, Math.ceil(prog().common.gasBefore - S.phaseT)) + NBSP + 'с';
        else if (ph === 'warm') sub = 'Прогрев: ' + Math.max(0, Math.ceil(prog().common.warmTime - S.phaseT)) + NBSP + 'с';
        else if (ph === 'welding' || ph === 'decay') { ang = weldAngle(); sub = 'Секция ' + sectorOf(ang) + ' из ' + nSec(); }
        else if (ph === 'halt') { ang = S.stopAngle; sub = 'Стоп'; }
        else if (ph === 'postpurge') { ang = S.stopAngle; sub = 'Секция ' + sectorOf(Math.min(359.9, ang)) + ' из ' + nSec(); }
        else if (ph === 'done') { ang = 360; sub = 'Шов готов'; }
        else if (ph === 'aborted') { ang = S.stopAngle; sub = 'Остановлено'; }
        else if (ph === 'returning') { ang = S.torch; sub = 'Возврат в' + NBSP + '0'; }

        gauge.setValue(ang / 360, 0);                    // лава показывает пройденный угол
        deg = Math.round(ph === 'ready' || ph === 'returning' ? S.torch : ang) + '°';
        if (deg !== lastDeg) { degEl.textContent = deg; lastDeg = deg; }
        if (sub !== lastSub) { subEl.textContent = sub; lastSub = sub; }
        if (ph === 'ready' && screen.hasAttribute('data-alert') !== !(torchZero() && gasOk() && waterOk())) syncHeader();

        if (S.screen === 'manual') {
          setText('abs-ang', Math.round(norm(S.absBase + S.torch)) + '°');
          var rv = $('rot-v');
          if (rv) { var v = norm(S.torch + 180) - 180; rv.querySelector('b').textContent = (Math.abs(v) >= 99.95 ? Math.round(v) : f1(v)) + '°'; }
          Object.keys(S.jog).forEach(function (k) {

          return '<div class="sheet" role="dialog" style="width:700px">' +
            '<h2><div>Параметры программы<small>Программа ' + pm.code + ' · изменение открыто</small></div></h2>' +
            '<div class="mseg">' + MODELS.map(function (m) { return '<button type="button" class="' + (m === pm.model ? 'is-on' : '') + '" data-mset="' + m + '">' + m + '</button>'; }).join('') + '</div>' +
            '<div class="mtiles">' +
            '<button class="mtile' + (isChg('m', 'd') ? ' is-chg' : '') + '" type="button" data-mnum="d"><label>Диаметр трубы</label><b>' + f1(pm.d) + NB + '<small>мм</small></b></button>' +
            '<button class="mtile' + (isChg('m', 't') ? ' is-chg' : '') + '" type="button" data-mnum="t"><label>Толщина трубы</label><b>' + f2(pm.t) + NB + '<small>мм</small></b></button>' +
            '</div>' +
            '<div class="kp-act"><button class="bt bt--ghost" type="button" data-relock>Закрыть изменение</button><button class="bt bt--blue" type="button" data-close>Готово</button></div></div>';
        }
        if (S.sheet === 'leave') {
          var nl = chgCount();
          return '<div class="sheet" role="dialog" style="width:560px">' +
            '<h2><div>Сохранить изменения?<small>' + nl + ' ' + plural(nl, 'параметр изменён', 'параметра изменены', 'параметров изменено') + ' в' + NB + 'программе ' + edProg().code + '</small></div></h2>' +
            '<div class="kp-act"><button class="bt bt--ghost" type="button" data-eleave>Не сохранять</button><button class="bt bt--green" type="button" data-esave-leave>Сохранить</button></div></div>';
        }
        return '';
      }
      function openSheet(name) {
        var fresh = !veil;
        S.sheet = name;
        if (!veil) {
          veil = document.createElement('div');
          veil.className = 'sheet-veil';
          screen.appendChild(veil);
          veil.addEventListener('click', onSheetClick);
          veil.addEventListener('pointerdown', function (e) {
            var b = e.target.closest('.sheet-done, .bt'); if (!b) return;
            b.classList.add('is-pressed');
            var up = function () { b.classList.remove('is-pressed'); document.removeEventListener('pointerup', up); };
            document.addEventListener('pointerup', up);
          });
        }
        veil.innerHTML = sheetHTML();
        if (!fresh) { veil.style.animation = 'none'; var sh = veil.querySelector('.sheet'); if (sh) sh.style.animation = 'none'; }
        veil.querySelectorAll('.sheet-done, .bt--green, .bt--blue').forEach(addRipple);
      }
      function closeSheet() {
        if (S.sheet === 'keypad' && S.kp && S.kp.back) { var back = S.kp.back; S.kp = null; openSheet(back); return; }
        S.sheet = null; S.kp = null;
        if (veil) { veil.remove(); veil = null; }
      }
      function onSheetClick(e) {
        var t;
        if (S.sheet === 'funcs' && (t = e.target.closest('[data-toggle]'))) {
          var c = prog().common, k = t.dataset.toggle;
          c[k] = !c[k];
          var on = t.querySelector('.switch').classList.toggle('is-on', c[k]);
          t.classList.toggle('is-on', on);
          t.setAttribute('aria-pressed', on);
          if (panelMode === 'ready') renderPanel();       // «таблетки» обновляются сразу
          note(COM[k].l + ': ' + (c[k] ? 'ВКЛ' : 'ВЫКЛ') + ' — сохранено в' + NBSP + 'программе ' + prog().code);
          return;
        }
        if ((t = e.target.closest('[data-key-in]'))) { kpKey(t.dataset.keyIn); return; }
        if ((t = e.target.closest('[data-kp]'))) { kpApply(t.dataset.kp === 'all'); return; }
        if ((t = e.target.closest('[data-mset]'))) {
          var p = edProg(), was = headOf(p.model), id = t.dataset.mset;
          p.model = id;
          if (headOf(id) !== was) note(id + ': ' + (headOf(id) === 'open' ? 'открытая' : 'закрытая') + ' головка — набор параметров изменится');
          openSheet('model'); renderScreen(); return;
        }
        if ((t = e.target.closest('[data-mnum]'))) {
          var pp = edProg(), isD = t.dataset.mnum === 'd';
          openKeypad({ kind: 'm', key: t.dataset.mnum, title: isD ? 'Диаметр трубы' : 'Толщина трубы', sub: 'Программа ' + pp.code, u: 'мм', min: isD ? 6 : 0.5, max: isD ? 300 : 20, dec: isD ? 1 : 2, cur: pp[t.dataset.mnum] });
          return;
        }
        if (e.target.closest('[data-relock]')) { S.ed.unlocked = false; closeSheet(); renderScreen(); note('Изменение закрыто'); return; }
        if (e.target.closest('[data-esave-leave]')) { saveEditor(); closeSheet(); S.ed = null; setScreen('programs'); return; }
        if (e.target.closest('[data-eleave]')) { closeSheet(); S.ed = null; setScreen('programs'); note('Изменения не сохранены'); return; }
        // крестик/«Готово»/мимо листа (у окна «Сохранить изменения?» мимо — не закрывает)
        if (e.target.closest('[data-close]') || (e.target === veil && S.sheet !== 'leave')) closeSheet();
      }
      function kpKey(x) {
        var k = S.kp;
        if (x === '⌫') k.buf = k.buf.slice(0, -1);
        else if (x === 'Сброс') k.buf = '';
        else if (x === '±') k.buf = k.buf.charAt(0) === '-' ? k.buf.slice(1) : (k.buf ? '-' + k.buf : '-');
        else { if (k.fresh) k.buf = ''; if (x === '.' && k.buf.indexOf('.') >= 0) return; if (k.buf.length < 8) k.buf += x; }
        k.fresh = false;
        openSheet('keypad');
      }
      function kpApply(all) {
        var k = S.kp, v = parseFloat(k.buf), p = edProg(), r = Math.round(v * Math.pow(10, k.dec)) / Math.pow(10, k.dec);
        if (k.kind === 's') { if (all) p.sec[k.key] = p.sec[k.key].map(function () { return r; }); else p.sec[k.key][k.i] = r; }
        else if (k.kind === 'm') p[k.key] = r;
        else { p.common[k.key] = r; if (k.key === 'sectors') resizeSectors(p, r); }
        var back = k.back;
        S.kp = null;
        if (back) openSheet(back); else closeSheet();
        renderScreen();
      }

      // ================= Режим ожидания =================
      var sbEl = null;
      function openStandby() {
        S.standby = true;
        sbEl = document.createElement('div');
        sbEl.className = 'standby';
        sbEl.innerHTML = '<div class="sb-ring"><div class="sb-fill" id="sb-fill"></div><div class="sb-face">' + svg('moon') + 'Ожидание</div></div>' +
          '<div class="sb-txt"><b>Режим ожидания</b><span>Коснитесь экрана, чтобы продолжить</span></div>';
        screen.appendChild(sbEl);
        sbEl.addEventListener('click', closeStandby);
        var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var t0 = performance.now(), T_WELD = 9000, T_PURGE = 1800, T_RESET = 700, T_ALL = T_WELD + T_PURGE + T_RESET;
        (function loop(now) {
          if (!S.standby) return;
          var f = $('sb-fill'); if (!f) return;
          var tc = still ? T_WELD * 0.58 : (now - t0) % T_ALL, bg, op = 1;
          if (tc < T_WELD) {          // лава заполняет кольцо
            var a = tc / T_WELD * 360;
            bg = 'conic-gradient(#F21500 0deg, #FF5A00 ' + (a * 0.55) + 'deg, #FFC000 ' + (a * 0.9) + 'deg, #FFE81A ' + a + 'deg, transparent ' + a + 'deg)';
          } else {                    // синяя продувка, затем гаснет
            bg = 'linear-gradient(45deg, #0650C8, #0A7FE0, #3DB0F2)';
            if (tc > T_WELD + T_PURGE) op = 1 - (tc - T_WELD - T_PURGE) / T_RESET;
          }
          f.style.background = bg; f.style.opacity = op.toFixed(2);
          if (!still) requestAnimationFrame(loop);
        })(t0);
      }
      function closeStandby() { S.standby = false; if (sbEl) { sbEl.remove(); sbEl = null; } }

      // ================= Действия по нажатию =================
      function act(a, el) {
        var busy = RUNNING.indexOf(S.phase) >= 0;
        switch (a) {
          case 'zero': returnZero(); break;
          case 'test-gas': if (!gasOk()) { note('Нет давления газа'); break; } S.test.gas = S.test.gas > 0 ? 0 : 5; renderScreen(); break;
          case 'test-water': if (!waterOk()) { note('Нет протока охлаждения'); break; } S.test.water = S.test.water > 0 ? 0 : 5; renderScreen(); break;
          case 'standby': openStandby(); break;
          case 'funcs': openSheet('funcs'); break;
          case 'psel': S.pSel = el.dataset.id; renderScreen(); break;
          case 'pload': {
            var p = S.progs.filter(function (x) { return x.id === S.pSel; })[0];
            S.progId = p.id; S.torch = 0; S.corr = { cur: 0, arc: 0, osc: 0, wire: 0, spd: 0 };
            go('ready'); renderScreen();
            note('Загружена программа ' + p.code + ' ' + p.model);
            break;
          }
          case 'edit': openEditor(S.pSel); break;
          case 'etab': S.ed.tab = el.dataset.id; renderScreen(); break;
          case 'esec': S.ed.sec = +el.dataset.id; renderScreen(); break;
          case 'ecell': editorTap(el.dataset.k, el.dataset.key, +el.dataset.i, el); break;
          case 'ediscard': S.ed.draft = clone(S.progs.filter(function (x) { return x.id === S.ed.id; })[0]); renderScreen(); note('Изменения отменены'); break;
          case 'esave': saveEditor(); renderScreen(); break;
        }
      }
      alt.addEventListener('click', function (e) {
        var el = e.target.closest('[data-a]'); if (!el) return;
        act(el.dataset.a, el);
      });
      $('status-zero').addEventListener('click', returnZero);

      // Кнопка «Назад»
      $('back-button').addEventListener('click', function () {
        if (S.screen === 'manual' || S.screen === 'programs') { setScreen('weld'); return; }
        if (S.screen === 'editor') { if (chgCount()) openSheet('leave'); else { S.ed = null; setScreen('programs'); } return; }
        note('«Сварка» — главный экран аппарата');
      });
      // Индикаторы газа и воды
      $('gas-indicator').addEventListener('click', function () {
        note(gasOk() ? 'Газ (аргон): давление 4,2' + NBSP + 'бар — норма' : 'Газ: давление 0' + NBSP + 'бар — откройте баллон');
      });
      $('water-indicator').addEventListener('click', function () {
        note(waterOk() ? 'Охлаждение: проток в' + NBSP + 'норме' : 'Охлаждение: нет протока — проверьте насос');
      });
      // Кнопка программы → место сохранения
      $('program-button').addEventListener('click', function () {
        if (RUNNING.indexOf(S.phase) >= 0) { note('Программу нельзя менять во время сварки'); return; }
        S.pSel = S.progId; setScreen('programs');
      });
      // Шестерёнка: на главном экране — ручной режим; в редакторе — открывает изменение программы
      settingsBtn.addEventListener('click', function () {
        if (S.screen === 'editor') {
          if (!S.ed.unlocked) {
            S.ed.unlocked = true; renderScreen();
            note('Изменение открыто: модель и труба — здесь, параметры секторов — в таблице');
          }
          openSheet('model'); return;
        }
        if (S.screen !== 'weld') return;
        if (['ready', 'done', 'aborted'].indexOf(S.phase) < 0) return;
        if (S.phase !== 'ready') { S.torch = S.phase === 'done' ? 0 : S.stopAngle; go('ready'); }
        setScreen('manual');
      });

      // Большие кнопки главного экрана
      startBtn.addEventListener('hold-confirm', startWeld);
      startBtn.addEventListener('hold-cancel', function () { note('Удерживайте СТАРТ 1' + NBSP + 'секунду — защита от' + NBSP + 'случайного запуска'); });
      startBtn.addEventListener('hold-denied', function () {
        note(!gasOk() ? 'Нет давления газа: проверьте баллон и' + NBSP + 'редуктор' : !waterOk() ? 'Нет протока охлаждения: проверьте контур'
          : 'Горелка не в' + NBSP + 'нуле: нажмите «В ноль» или верните её в' + NBSP + 'ручном режиме');
      });
      $('stop-button').addEventListener('click', stopNow);
      smooth.addEventListener('click', smoothStop);
      returnBtn.addEventListener('click', function () { if (S.phase === 'aborted') returnZero(); });
      $('done-button').addEventListener('click', function () {
        if (S.phase === 'done') { S.torch = 0; go('ready'); }
      });

      // Нажатое состояние: чуть темнее, пока палец на кнопке
      document.querySelectorAll('.weld-btn, .done-button').forEach(function (btn) {
        function press() { btn.classList.add('is-pressed'); }
        function release() { btn.classList.remove('is-pressed'); }
        btn.addEventListener('pointerdown', press);
        btn.addEventListener('pointerup', release);
        btn.addEventListener('pointerleave', release);
        btn.addEventListener('pointercancel', release);
      });

      // Волна от места касания на больших цветных кнопках (кроме «СТАРТ» — там полоса удержания)
      document.querySelectorAll('.weld-btn, .done-button').forEach(addRipple);
      function addRipple(btn) {
        if (btn.dataset.ripple) return;
        btn.dataset.ripple = '1';
        btn.addEventListener('pointerdown', function (e) {
          var r = btn.getBoundingClientRect();
          var k = r.width / btn.offsetWidth;            // экран может быть уменьшен под окно
          var dot = document.createElement('span');
          dot.className = 'ripple';
          dot.style.left = (e.clientX - r.left) / k + 'px';
          dot.style.top = (e.clientY - r.top) / k + 'px';
          btn.appendChild(dot);
          dot.addEventListener('animationend', function () { dot.remove(); });
        });
      }

      // ================= Панель презентера =================
      $('deck').addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        if (b.dataset.head && b.dataset.head !== headOf(prog().model)) {
          var keep = { speed: S.speed, scn: S.scn, screen: S.screen === 'manual' ? 'manual' : 'weld' };
          closeSheet(); closeStandby();
          S = freshState(b.dataset.head); Object.assign(S, keep); window.weldSim = S;
          go('ready'); renderScreen();
        }
        if (b.dataset.speed) { S.speed = +b.dataset.speed; syncHeader(); }
        if (b.dataset.scn) { S.scn = b.dataset.scn; syncHeader(); if (S.screen === 'manual') renderScreen(); }
        if (b.id === 'deck-reset') {
          var sp = S.speed;
          closeSheet(); closeStandby();
          S = freshState(headOf(prog().model)); S.speed = sp; window.weldSim = S;
          go('ready'); renderScreen(); note('Демо сброшено');
        }
      });
      document.addEventListener('keydown', function (e) {
        if (['h', 'H', 'р', 'Р'].indexOf(e.key) >= 0 && !e.metaKey && !e.ctrlKey) {
          $('deck').classList.toggle('is-hidden');
          if (typeof fitDevice === 'function') fitDevice();
        }
      });

      go('ready');
      renderScreen();
      requestAnimationFrame(tick);
      window.weldSim = S;   // для проверки
    })();
  </script>
</body>
</html>
